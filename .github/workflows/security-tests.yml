name: Security and RLS tests

on:
  pull_request:
    paths:
      - ".github/workflows/security-tests.yml"
      - "package.json"
      - "package-lock.json"
      - "supabase/**"
      - "tests/security/**"
      - "vitest.security.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/security-tests.yml"
      - "package.json"
      - "package-lock.json"
      - "supabase/**"
      - "tests/security/**"
      - "vitest.security.config.ts"

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local Supabase security suite
        run: npm run test:security
