<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071a36" />
    <title>Matchday is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f6f9f7;
        color: #071a36;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        padding: 32px 24px;
        border: 1px solid #cce2cf;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 60px rgba(7, 26, 54, 0.08);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: #071a36;
        color: #fff;
        font-size: 28px;
        font-weight: 900;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      p {
        margin: 12px 0 0;
        color: #607086;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <h1>Matchday is offline</h1>
      <p>
        Reconnect to continue managing your team. Your saved match history
        remains protected and unchanged.
      </p>
    </main>
  </body>
</html>
